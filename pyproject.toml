[project]
name = "tekti"
version = "0.1.0"
description = "A review board for requirements documents: defects tied to the text, and questions addressed to whoever can answer them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "jinja2>=3.1",
    "strands-agents[anthropic,gemini,openai]>=1.67.0",
    "boto3>=1.44.11",
    "python-dotenv>=1.2.4",
    "pymupdf>=2.1",
]

[project.scripts]
tekti = "tekti.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tekti"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
ignore = ["UP047", "UP046"]
