    note: The process covers only the happy path; refund, settings change and failure branches are absent.

  # ---------------------------------------------------------------- Part B: REST API
  - id: G-34
    part: B
    anchor: "Сохранение порога. Функциональные требования: чтение порога"
    criterion: set_consistent
    critical: true
    note: The description says both saving and reading for the same method.

  - id: G-35
    part: B
    anchor: "| **REST type** | GET |"
    related: "Заменить настройку и вернуть результат сохранения"
    criterion: correct
    critical: true
    note: A GET with query parameters changes state; parameters end up in logs and caches and the call may be repeated by intermediaries.

  - id: G-36
    part: B
    anchor: "При отклонении суммы вернуть прежнее состояние и результат ERROR"
    related: "**400.** Ответ в случае, если параметры запроса заполнены неверно."
    criterion: set_consistent
    critical: true
    note: A rejected amount is returned as ERROR inside a 200 response by the example, while 400 is defined for invalid parameters.

  - id: G-37
    part: B
    anchor: "Если результат 200 или 201 — успешный"
    related: '{"result":"ERROR","message":"Проверьте сумму"}'
    criterion: set_consistent
    critical: true
    note: 200 is declared successful but an ERROR body is shown under 200.

  - id: G-38
    part: B
    anchor: "Если результат 200 или 201 — успешный"
    related: "#### 200. Successful — Created"
    criterion: set_consistent
    critical: false
    note: 201 is mentioned but never described; 200 is labelled "Created".

  - id: G-39
    part: B
    anchor: "Для чужой карты возвращается 404, как и для отсутствующей карты."
    related: "**403.** Ответ в случае, если на указанный ресурс доступ запрещен."
    criterion: set_consistent
    critical: true
    note: 403 is listed as a status, yet its own section says 404 is returned; 404 is missing from the status list and no case for 403 remains.

  - id: G-40
    part: B
    anchor: "| `amount` | integer | 32 bit | Да | 1 000–1 000 000 | Порог в тенге | `limit_kzt` |"
    related: "| `amount` | string | При успехе | Порог в тенге | `limit_kzt` |"
    criterion: set_consistent
    critical: false
    note: The fields `amount` and `enabled` are integers in the request and strings in the response.

  - id: G-41
    part: B
    anchor: "* **Content-Type:** `application/json` ."
    related: "* Тело не используется."
    criterion: set_consistent
    critical: false
    note: A content type is declared for a request with no body.

  - id: G-42
    part: B
    anchor: "При отклонении суммы вернуть прежнее состояние и результат ERROR"
    related: '{"result":"ERROR","message":"Проверьте сумму"}'
    criterion: set_consistent
    critical: false
    note: The rule says the previous state is returned; the ERROR example carries no amount or enabled.

  - id: G-43
    part: B
    anchor: '{"message":"Некорректный запрос"}'
    related: "| `result` | string | OK / ERROR | Исход сохранения | — |"
    criterion: set_consistent
    critical: false
    note: Error bodies for 4xx and 5xx contain only `message`, without the `result` field the response table defines; no machine-readable error code.

