    critical: false
    note: Components are named differently across sections (сервис уведомлений / сервис push; учёт расходов / сервис расходов).

  - id: G-32
    part: A
    anchor: "#### Функциональные требования"
    criterion: traceable
    critical: false
    note: Only Ф-1 to Ф-4 have identifiers; non-functional, data, integration and acceptance items have none and Part B does not reference Ф identifiers.

  - id: G-33
    part: A
    anchor: "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение."
    criterion: set_complete
