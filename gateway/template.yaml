AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Tekti gateway - a thin HTTPS pass-through on a public Lambda function URL that
  lets the owner token and signed-in GitHub users call the owner's OpenAI, Anthropic
  and Google models without holding the vendor keys. Token and session check, GitHub
  login allowlist, model allowlist, request caps, access expiry and body size limit
  are enforced in code. Deploy with gateway/deploy.sh (aws cloudformation package + deploy).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Access }
        Parameters: [AllowedModels, OwnerRequestCap]
      - Label: { default: GitHub sign-in }
        Parameters: [AllowedGithubLogins, GithubUserRequestCap, GithubTotalRequestCap, GithubAccessExpiryDate]
      - Label: { default: Runtime }
        Parameters: [ReservedConcurrency, PythonRuntime, SecretCacheSeconds]

Parameters:
  AllowedModels:
    Type: String
    Description: >-
      Comma-separated model names the gateway will forward (exact match; for
      Google a leading "models/" is ignored). The default is a placeholder: set
      it to the models Tekti actually uses. Anything not listed is refused with 403.
    Default: gpt-5,claude-sonnet-4-5,gemini-2.5-pro
    AllowedPattern: "^[A-Za-z0-9._:/@-]+(,[A-Za-z0-9._:/@-]+)*$"
    ConstraintDescription: a non-empty comma-separated list of model names without spaces
  OwnerRequestCap:
    Type: Number
    Description: Total requests the owner token may make (counter in DynamoDB). 0 blocks the token.
    Default: 3000
    MinValue: 0
  AllowedGithubLogins:
    Type: String
    Description: >-
      Comma-separated GitHub logins that may sign in (case-insensitive), checked at sign-in and
      on every request. Empty means ANY GitHub user may sign in, limited only by the caps.
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9-]+(,[A-Za-z0-9-]+)*$"
    ConstraintDescription: empty or a comma-separated list of GitHub logins without spaces
  GithubUserRequestCap:
    Type: Number
    Description: Total requests each signed-in GitHub login may make. 0 blocks all signed-in users.
    Default: 400
    MinValue: 0
  GithubTotalRequestCap:
    Type: Number
    Description: Total requests all signed-in GitHub users together may make. 0 blocks all of them.
    Default: 4000
    MinValue: 0
  GithubAccessExpiryDate:
    Type: String
    Description: >-
      Last day (UTC, YYYY-MM-DD) on which GitHub sign-in and GitHub sessions are accepted.
      Empty means no end date (sessions still last 24 hours).
    Default: ""
    AllowedPattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    ConstraintDescription: empty or a date in the form YYYY-MM-DD
  ReservedConcurrency:
    Type: Number
    Description: >-
      Reserved concurrency for the function. -1 (default) reserves nothing, which is required in
      accounts whose total Lambda concurrency limit is 10, because Lambda keeps at least 10
      unreserved. 0 stops all traffic (emergency switch).
    Default: -1
    MinValue: -1
  PythonRuntime:
    Type: String
    Description: Lambda Python runtime. The code uses only the standard library and the runtime's boto3.
    Default: python3.15
    AllowedValues: [python3.15, python3.14, python3.13]
  SecretCacheSeconds:
    Type: Number
    Description: How long the function caches vendor keys and gateway tokens in memory.
    Default: 120
    MinValue: 0
    MaxValue: 900

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, -1]]

Resources:
  # ------------------------------------------------------------------ secrets
  VendorKeysSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Holds the owner's vendor API keys; the owner replaces the placeholders in the console.
        must: >-
          Never change SecretString in this template after the first deploy - CloudFormation
          would then overwrite the keys the owner entered by hand.
    Properties:
      Name: !Sub "${AWS::StackName}/vendor-keys"
      Description: Tekti gateway vendor API keys (JSON with openai, anthropic, google). Edit in the console.
      SecretString: '{"openai":"REPLACE_ME","anthropic":"REPLACE_ME","google":"REPLACE_ME"}'

  OwnerTokenSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Gateway token for the owner, generated by Secrets Manager so nobody types or sees it in a template.
    Properties:
      Name: !Sub "${AWS::StackName}/token-owner"
      Description: Tekti gateway token named owner (40 letters and digits).
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
        IncludeSpace: false

  SessionSigningKeySecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          HMAC-SHA256 key that signs GitHub sessions (tks1 tokens). Putting a new random value in
          this secret ends every GitHub session within SecretCacheSeconds.
        must: Never logged or output; at least 32 characters.
    Properties:
      Name: !Sub "${AWS::StackName}/session-signing-key"
      Description: Tekti gateway key that signs GitHub sessions (64 letters and digits).
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false

  # ------------------------------------------------------------------ request counters
  CounterTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: One item per token name with an atomic request count; the function refuses at the cap.
        must: Counters are disposable; deleting the stack deletes them on purpose.
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # ------------------------------------------------------------------ logging
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-gateway"
      RetentionInDays: 30

  # ------------------------------------------------------------------ function
  FunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Least privilege - read exactly three secrets, update one table, write one log group.
    Properties:
      Description: Execution role for the Tekti gateway function
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: gateway-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadGatewaySecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref VendorKeysSecret
                  - !Ref OwnerTokenSecret
                  - !Ref SessionSigningKeySecret
              # UpdateItem covers both plain updates and the Update actions inside
              # TransactWriteItems (the per-user and all-users counters move together).
              - Sid: CountRequests
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt CounterTable.Arn
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${FunctionLogGroup.Arn}:*"

  GatewayFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          Buffered pass-through; standard library plus the runtime's boto3, so the code ships as a plain
          zip. Timeout 300 s because model calls can take minutes (API Gateway was ruled out for its
          shorter integration timeout).
        must: Never log secret values, request or response bodies, headers or query strings.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-gateway"
      Description: Tekti gateway - token check, limits and pass-through to OpenAI, Anthropic and Google
      Runtime: !Ref PythonRuntime
      Architectures: [arm64]
      Handler: handler.handler
      # Local directory; deploy.sh stages handler.py into it and `aws cloudformation package`
      # zips and uploads it, replacing this value with an S3 location.
      Code: function/
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
        LogFormat: Text
      Environment:
        Variables:
          VENDOR_KEYS_SECRET_ARN: !Ref VendorKeysSecret
          OWNER_TOKEN_SECRET_ARN: !Ref OwnerTokenSecret
          SESSION_SIGNING_SECRET_ARN: !Ref SessionSigningKeySecret
          COUNTER_TABLE: !Ref CounterTable
          OWNER_CAP: !Ref OwnerRequestCap
          ALLOWED_GITHUB_LOGINS: !Ref AllowedGithubLogins
          GITHUB_USER_CAP: !Ref GithubUserRequestCap
          GITHUB_TOTAL_CAP: !Ref GithubTotalRequestCap
          GITHUB_EXPIRES: !Ref GithubAccessExpiryDate
          GITHUB_SIGNIN_DAILY_LIMIT: "10"
          ALLOWED_MODELS: !Ref AllowedModels
          SECRET_CACHE_SECONDS: !Ref SecretCacheSeconds
          UPSTREAM_TIMEOUT_SECONDS: "280"

  GatewayUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt GatewayFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  # A public function URL needs both statements: InvokeFunctionUrl (auth type NONE)
  # and InvokeFunction restricted to calls that come through the function URL.
  PublicUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GatewayFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicUrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GatewayFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  GatewayUrl:
    Description: Base URL for TEKTI_GATEWAY_URL (strip the trailing slash)
    Value: !GetAtt GatewayUrl.FunctionUrl
  FunctionName:
    Description: Gateway Lambda function name
    Value: !Ref GatewayFunction
  VendorKeysSecretName:
    Description: Secret to edit in the console with the real vendor keys
    Value: !Sub "${AWS::StackName}/vendor-keys"
  VendorKeysSecretArn:
    Description: ARN of the vendor keys secret
    Value: !Ref VendorKeysSecret
  OwnerTokenSecretName:
    Description: Secret holding the owner gateway token
    Value: !Sub "${AWS::StackName}/token-owner"
  SessionSigningKeySecretName:
    Description: Secret holding the key that signs GitHub sessions (rotate it to end every session)
    Value: !Sub "${AWS::StackName}/session-signing-key"
  CounterTableName:
    Description: DynamoDB table with one request counter per token name
    Value: !Ref CounterTable
  LogGroupName:
    Description: CloudWatch log group with one JSON line per request
    Value: !Ref FunctionLogGroup
